<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EstateReel — Cinematic Property Video Belgium</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{
  --cream:#F7F3EE;
  --cream2:#EFE9E0;
  --cream3:#E5DDD0;
  --dark:#1A1410;
  --dark2:#2A2018;
  --dark3:#3A2E22;
  --gold:#B8965A;
  --gold2:#D4AF74;
  --gold3:#F0D4A0;
  --text:#1A1410;
  --muted:#6B5D4F;
  --border:rgba(184,150,90,0.2);
  --border2:rgba(184,150,90,0.4);
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--cream);color:var(--text);font-family:'Jost',sans-serif;overflow-x:hidden}

/* Nav */
nav{position:fixed;top:0;left:0;right:0;z-index:100;padding:1.5rem 3rem;display:flex;align-items:center;justify-content:space-between;transition:all 0.5s}
nav.scrolled{background:rgba(247,243,238,0.96);backdrop-filter:blur(12px);border-bottom:1px solid var(--border);padding:1rem 3rem}
.logo{font-family:'Playfair Display',serif;font-size:22px;font-weight:400;letter-spacing:0.08em;color:var(--dark)}
.logo span{color:var(--gold)}
.nav-links{display:flex;gap:2.5rem;align-items:center}
.nav-links a{font-size:12px;color:var(--muted);text-decoration:none;letter-spacing:0.12em;text-transform:uppercase;transition:color 0.3s}
.nav-links a:hover{color:var(--gold)}
.nav-cta{background:var(--dark);color:var(--cream);border:none;padding:10px 24px;font-size:11px;font-weight:400;cursor:pointer;font-family:'Jost',sans-serif;transition:all 0.3s;letter-spacing:0.12em;text-transform:uppercase;text-decoration:none;display:inline-block}
.nav-cta:hover{background:var(--gold);color:var(--dark)}

/* Hero */
.hero{min-height:100vh;display:grid;grid-template-columns:1fr 1fr;position:relative;overflow:hidden}
.hero-left{background:var(--dark);display:flex;flex-direction:column;justify-content:flex-end;padding:8rem 4rem 5rem;position:relative;overflow:hidden}
.hero-left::before{content:'';position:absolute;inset:0;background:url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23B8965A' fill-opacity='0.04'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");opacity:0.5}
.hero-tag{font-size:10px;letter-spacing:0.25em;text-transform:uppercase;color:var(--gold);margin-bottom:2rem;display:flex;align-items:center;gap:12px}
.hero-tag::before{content:'';width:40px;height:1px;background:var(--gold)}
.hero-title{font-family:'Playfair Display',serif;font-size:clamp(42px,5vw,68px);font-weight:400;line-height:1.1;color:var(--cream);margin-bottom:1.5rem;letter-spacing:-0.01em}
.hero-title em{font-style:italic;color:var(--gold2)}
.hero-sub{font-size:14px;color:rgba(247,243,238,0.55);line-height:1.8;margin-bottom:2.5rem;font-weight:300;max-width:400px;letter-spacing:0.02em}
.hero-btns{display:flex;gap:12px;flex-wrap:wrap}
.btn-gold{background:var(--gold);color:var(--dark);border:none;padding:14px 32px;font-size:11px;font-weight:500;cursor:pointer;font-family:'Jost',sans-serif;transition:all 0.3s;letter-spacing:0.15em;text-transform:uppercase;text-decoration:none;display:inline-block}
.btn-gold:hover{background:var(--gold2)}
.btn-outline{background:transparent;color:var(--cream);border:1px solid rgba(247,243,238,0.3);padding:14px 32px;font-size:11px;cursor:pointer;font-family:'Jost',sans-serif;transition:all 0.3s;letter-spacing:0.15em;text-transform:uppercase;text-decoration:none;display:inline-block}
.btn-outline:hover{border-color:var(--gold);color:var(--gold)}
.hero-right{position:relative;overflow:hidden}
.hero-right video{width:100%;height:100%;object-fit:cover}
.hero-right::after{content:'';position:absolute;inset:0;background:linear-gradient(to right,var(--dark) 0%,transparent 30%)}
.hero-scroll{position:absolute;bottom:3rem;left:4rem;display:flex;align-items:center;gap:12px;color:rgba(247,243,238,0.4);font-size:10px;letter-spacing:0.2em;text-transform:uppercase}
.hero-scroll::after{content:'';width:48px;height:1px;background:rgba(247,243,238,0.2)}

/* Divider */
.divider{height:1px;background:linear-gradient(to right,transparent,var(--gold),transparent);margin:0}

/* Stats */
.stats{background:var(--dark2);padding:3rem;display:grid;grid-template-columns:repeat(4,1fr)}
.stat{text-align:center;padding:1.5rem;border-right:1px solid rgba(184,150,90,0.15)}
.stat:last-child{border-right:none}
.snum{font-family:'Playfair Display',serif;font-size:48px;font-weight:400;color:var(--gold2);line-height:1;display:block}
.slabel{font-size:11px;color:rgba(247,243,238,0.45);margin-top:8px;line-height:1.5;letter-spacing:0.08em;text-transform:uppercase}
.ssource{font-size:10px;color:rgba(184,150,90,0.5);margin-top:6px;display:block;letter-spacing:0.08em;font-style:italic}
.stats-note{background:var(--dark3);padding:0.75rem 3rem;text-align:center;font-size:11px;color:rgba(247,243,238,0.3);letter-spacing:0.05em;border-bottom:1px solid rgba(184,150,90,0.1)}
.stats-note span{color:var(--gold);opacity:0.6}

/* Section base */
.sec{padding:7rem 5rem;max-width:1300px;margin:0 auto}
.sec-tag{font-size:10px;letter-spacing:0.25em;text-transform:uppercase;color:var(--gold);margin-bottom:1rem;display:flex;align-items:center;gap:12px}
.sec-tag::before{content:'';width:30px;height:1px;background:var(--gold)}
h2{font-family:'Playfair Display',serif;font-size:clamp(36px,4vw,52px);font-weight:400;line-height:1.15;margin-bottom:1rem;letter-spacing:-0.01em}
h2 em{font-style:italic;color:var(--gold)}
.sec-sub{font-size:14px;color:var(--muted);line-height:1.8;margin-bottom:4rem;max-width:560px;font-weight:300}

/* Full tour video */
.tour-wrap{position:relative;border:1px solid var(--border2);overflow:hidden;background:var(--dark);min-height:400px;display:flex;align-items:center;justify-content:center}
.tour-wrap video{width:100%;display:block;max-height:600px;object-fit:cover}
.tour-overlay{position:absolute;inset:0;background:rgba(26,20,16,0.35);display:flex;align-items:center;justify-content:center;transition:opacity 0.3s;cursor:pointer}
.tour-overlay:hover{background:rgba(26,20,16,0.2)}
.tour-play{width:80px;height:80px;border:1px solid var(--gold2);display:flex;align-items:center;justify-content:center;color:var(--gold2);font-size:24px;transition:all 0.3s}
.tour-overlay:hover .tour-play{background:var(--gold);border-color:var(--gold);color:var(--dark)}
.tour-label{position:absolute;bottom:1.5rem;left:1.5rem;background:rgba(26,20,16,0.85);color:var(--cream3);font-size:11px;padding:6px 16px;letter-spacing:0.1em;text-transform:uppercase;border-left:2px solid var(--gold)}

/* Rooms */
.rooms-section{background:var(--cream2);padding:7rem 5rem}
.rooms-inner{max-width:1300px;margin:0 auto}
.rooms-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:1px;background:var(--border);border:1px solid var(--border);margin-top:3rem}
.room-card{background:var(--cream);position:relative;overflow:hidden;cursor:pointer}
.room-video-wrap{position:relative;aspect-ratio:16/9;overflow:hidden;background:var(--dark);}
.room-video{width:100%;height:100%;object-fit:cover;object-position:center center;display:block;transition:transform 0.6s ease}
.room-card:hover .room-video{transform:scale(1.06)}
.room-play{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(26,20,16,0.3);transition:all 0.3s}
.room-play-btn{width:44px;height:44px;border:1px solid rgba(247,243,238,0.8);display:flex;align-items:center;justify-content:center;color:var(--cream);font-size:14px;transition:all 0.3s}
.room-card:hover .room-play-btn{background:var(--gold);border-color:var(--gold);color:var(--dark)}
.room-info{padding:1.25rem 1.5rem;border-top:1px solid var(--border)}
.room-name{font-family:'Playfair Display',serif;font-size:16px;font-weight:400;margin-bottom:4px;color:var(--dark)}
.room-dur{font-size:11px;color:var(--muted);letter-spacing:0.08em;text-transform:uppercase;margin-bottom:10px}
.room-tags{display:flex;gap:6px;flex-wrap:wrap}
.rtag{font-size:10px;border:1px solid var(--border2);padding:3px 10px;color:var(--muted);letter-spacing:0.05em}

/* Services */
.services-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:1px;background:var(--border);border:1px solid var(--border);margin-top:3rem}
.service{background:var(--cream);padding:2.5rem;transition:background 0.3s}
.service:hover{background:var(--cream2)}
.service-num{font-family:'Playfair Display',serif;font-size:36px;font-weight:400;color:var(--gold);opacity:0.4;margin-bottom:1rem;line-height:1}
.service-title{font-family:'Playfair Display',serif;font-size:20px;font-weight:400;margin-bottom:10px}
.service-desc{font-size:13px;color:var(--muted);line-height:1.8;font-weight:300}

/* Pricing */
.pricing-section{background:var(--dark);padding:7rem 5rem}
.pricing-inner{max-width:1300px;margin:0 auto}
.pricing-section .sec-tag{color:var(--gold)}
.pricing-section .sec-tag::before{background:var(--gold)}
.pricing-section h2{color:var(--cream)}
.pricing-section h2 em{color:var(--gold2)}
.pricing-section .sec-sub{color:rgba(247,243,238,0.5)}
.plans{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:rgba(184,150,90,0.15);border:1px solid rgba(184,150,90,0.15);margin-top:3rem}
.plan{background:var(--dark2);padding:2.5rem;transition:background 0.3s}
.plan:hover{background:var(--dark3)}
.plan.feat{background:var(--dark3);border-top:2px solid var(--gold)}
.pbadge{display:inline-block;border:1px solid var(--gold);color:var(--gold);font-size:10px;padding:3px 14px;margin-bottom:1.5rem;letter-spacing:0.15em;text-transform:uppercase}
.pname{font-size:11px;color:rgba(247,243,238,0.4);margin-bottom:8px;letter-spacing:0.15em;text-transform:uppercase}
.pprice{font-family:'Playfair Display',serif;font-size:56px;font-weight:400;line-height:1;margin-bottom:6px;color:var(--cream)}
.pprice sup{font-size:24px;vertical-align:super;color:var(--gold)}
.pprice sub{font-size:16px;color:rgba(247,243,238,0.4);font-family:'Jost',sans-serif}
.pdesc{font-size:13px;color:rgba(247,243,238,0.45);margin-bottom:2rem;line-height:1.7;font-weight:300;padding-top:1rem;border-top:1px solid rgba(184,150,90,0.15)}
.plist{list-style:none;display:flex;flex-direction:column;gap:12px;margin-bottom:2rem}
.plist li{font-size:13px;color:rgba(247,243,238,0.6);display:flex;align-items:center;gap:10px;font-weight:300}
.plist li::before{content:'—';color:var(--gold);font-size:12px;flex-shrink:0}
.pbtn{width:100%;padding:13px;font-size:11px;cursor:pointer;font-family:'Jost',sans-serif;transition:all 0.3s;letter-spacing:0.15em;text-transform:uppercase;background:transparent;color:rgba(247,243,238,0.6);border:1px solid rgba(184,150,90,0.3)}
.pbtn:hover{border-color:var(--gold);color:var(--gold)}
.plan.feat .pbtn{background:var(--gold);color:var(--dark);border:none;font-weight:500}
.plan.feat .pbtn:hover{background:var(--gold2)}

/* Steps */
.steps-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:2rem;margin-top:3rem}
.step{position:relative;background:var(--cream2);border:1px solid var(--border);padding:2rem;transition:all 0.3s}
.step:hover{border-color:var(--border2);background:var(--cream3)}
.step::after{content:'';position:absolute;top:2.5rem;right:-1rem;width:2rem;height:1px;background:var(--border2);z-index:1}
.step:last-child::after{display:none}
.step-n{font-family:'Playfair Display',serif;font-size:40px;font-weight:400;color:var(--gold);opacity:0.3;line-height:1;margin-bottom:1rem}
.step-t{font-family:'Playfair Display',serif;font-size:16px;font-weight:400;margin-bottom:10px;color:var(--dark)}
.step-d{font-size:12px;color:var(--muted);line-height:1.8;font-weight:300}
/* AI Note */
.ai-note{display:flex;align-items:flex-start;gap:1.5rem;background:var(--dark2);border:1px solid rgba(184,150,90,0.25);padding:2rem 2.5rem;margin-top:3rem;border-left:3px solid var(--gold)}
.ai-note-icon{font-size:24px;color:var(--gold);flex-shrink:0;margin-top:2px}
.ai-note-title{font-family:'Playfair Display',serif;font-size:17px;font-weight:400;color:var(--cream);margin-bottom:8px}
.ai-note-desc{font-size:13px;color:rgba(247,243,238,0.5);line-height:1.8;font-weight:300}

/* Free banner */
.banner{background:var(--cream2);border:1px solid var(--border2);padding:4rem 5rem;display:flex;align-items:center;justify-content:space-between;gap:3rem;margin:0 5rem 7rem;max-width:1300px;margin-left:auto;margin-right:auto;position:relative;overflow:hidden}
.banner::before{content:'';position:absolute;top:0
